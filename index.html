<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Document Library</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16324f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Library">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;--bg:#f3f5f8;--panel:#fff;--ink:#16202c;--mute:#667385;--line:#dde2ea;--brand:#16324f;--acc:#1d6fd6;--hl:#ffe066;--pdf:#c0392b;--xls:#1e8449;--r:8px}
:root[data-theme="dark"]{--bg:#0e1319;--panel:#171e27;--ink:#e6ebf2;--mute:#92a0b2;--line:#27313e;--brand:#0b1a2b;--acc:#5aa2ff;--hl:#7a6200;--pdf:#ec7063;--xls:#52be80}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column}
header{background:var(--brand);color:#fff;display:flex;gap:10px;align-items:center;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top,0px))}
.logo{font-weight:700;white-space:nowrap}
#q{flex:1;min-width:0;max-width:680px;padding:10px 14px;border-radius:var(--r);border:0;font:inherit;background:#fff;color:#16202c}
#q:focus,button:focus-visible,select:focus-visible{outline:3px solid var(--hl);outline-offset:1px}
button,.btn,select{font:inherit;font-size:.86rem;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:var(--r)}
button:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
#menubtn{display:none}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:310px 1fr}
aside{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
main{overflow:auto;padding:18px 22px;padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
@media(max-width:800px){#menubtn{display:inline-block}.wrap{grid-template-columns:1fr}aside{display:none;position:fixed;inset:0;top:56px;z-index:9}body.open aside{display:flex}main{padding:14px}.logo span{display:none}}
h2{font-size:1.1rem;margin:0 0 10px}h3{font-size:.95rem;margin:18px 0 8px}
.file{border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.file summary{cursor:pointer;padding:8px 9px;font-weight:600;display:flex;gap:6px;align-items:center;list-style:none}
.file summary::-webkit-details-marker{display:none}
.file .n{flex:1;word-break:break-word;font-size:.86rem}
.badge{font-size:.68rem;font-weight:700;color:#fff;padding:2px 6px;border-radius:4px}
.b-pdf{background:var(--pdf)}.b-xls{background:var(--xls)}
.cnt{font-size:.72rem;background:var(--acc);color:#fff;border-radius:10px;padding:0 7px}
.tag{font-size:.72rem;color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:0 7px}
.sec{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;border-radius:0;background:none;padding:5px 12px 5px 16px;font-size:.84rem;color:var(--mute)}
.sec:hover{background:var(--panel)}.sec.on{background:var(--acc);color:#fff}
.ic{border:0;background:none;color:var(--mute);padding:2px 5px;font-size:.78rem}.ic.d{color:var(--pdf)}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{border-radius:16px;padding:4px 12px}.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;cursor:pointer}
.card:hover{border-color:var(--acc)}
.card .t{display:flex;gap:8px;align-items:center;font-weight:600;margin-bottom:4px;flex-wrap:wrap}
.card p{margin:0;color:var(--mute);font-size:.9rem}
mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile b{display:block;font-size:1.5rem;line-height:1.2}.tile span{color:var(--mute);font-size:.82rem}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .t{flex:1;font-weight:600;word-break:break-word;min-width:140px}
#stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:calc(100vh - 200px)}
.pdfw{position:relative;line-height:0;margin:0 auto}
.pdfw canvas{display:block;width:100%;height:auto}
.pdfw i{position:absolute;background:rgba(255,214,0,.45);mix-blend-mode:multiply;border-radius:2px}
.xl table{border-collapse:collapse;font:13px/1.4 Calibri,Arial,sans-serif;min-width:100%}
.xl td{border:1px solid var(--line);padding:3px 8px;white-space:pre}
.xl tr:first-child td{font-weight:700;background:var(--bg);position:sticky;top:0}
#note{width:100%;margin-top:12px;min-height:70px;padding:10px;border:1px solid var(--line);border-radius:var(--r);font:inherit;background:var(--panel);color:var(--ink)}
.muted{color:var(--mute);font-size:.88rem}
#drop{border:2px dashed var(--line);border-radius:12px;padding:30px 20px;text-align:center;background:var(--panel);margin-top:14px}
#status{font-size:.76rem;color:var(--mute);margin-top:auto}
#msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--brand);color:#fff;padding:9px 16px;border-radius:var(--r);font-size:.88rem;display:none;z-index:20;max-width:90%}
body{height:100dvh}
.nav{display:none}
@media(max-width:800px){
 html,body{overscroll-behavior:none}
 #menubtn,.hdr-up{display:none}
 button,.btn,select{min-height:44px}
 main{padding-bottom:90px}
 aside{top:0;bottom:62px;padding-top:max(14px,env(safe-area-inset-top,0px))}
 .nav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
 .nav button{flex:1;border:0;border-radius:0;background:none;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;color:var(--mute)}
 .nav button span{font-size:1.3rem;line-height:1}
 #stage{max-height:calc(100dvh - 270px);touch-action:pan-x pan-y pinch-zoom}
 #msg{bottom:84px}
}
</style>
</head>
<body>
<header>
  <button id="menubtn" aria-label="Open library">☰</button>
  <div class="logo">📚 <span>Library Pro</span></div>
  <input id="q" type="search" placeholder='Search all files…  "exact phrase"  -exclude   ( / )' aria-label="Search">
  <label class="btn pri hdr-up">Upload<input id="f" type="file" accept=".pdf,.xlsx,.xls,.csv" multiple hidden></label>
  <button id="install" hidden>Install</button>
  <button id="theme" aria-label="Toggle dark mode">🌓</button>
</header>
<div class="wrap">
  <aside>
    <select id="cat" aria-label="Category"></select>
    <div id="menu"></div>
    <div style="display:flex;gap:6px"><button id="exp">Backup</button><label class="btn">Restore<input id="imp" type="file" accept=".json" hidden></label></div>
    <div id="status"></div>
  </aside>
  <main id="view"></main>
</div>
<nav class="nav" aria-label="Main"><button id="nHome"><span>🏠</span>Home</button><button id="nSearch"><span>🔍</span>Search</button><button id="nLib"><span>📂</span>Library</button><button id="nUp"><span>⬆️</span>Upload</button></nav>
<div id="msg" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let docs=[],sel=null,term='',P={inc:[],exc:[]},filt='all',cat='',extra=[],z=1,token=0,pdfCache={},xlOnly=true;
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const words=()=>P.inc;
const re=()=>new RegExp('('+words().map(w=>rx(esc(w))).join('|')+')','gi');
const hl=s=>words().length?esc(s).replace(re(),'<mark>$1</mark>'):esc(s);
const BD=d=>`<span class="badge b-${d.type}">${d.type==='pdf'?'PDF':'XLS'}</span>`;
let mt;const toast=t=>{const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(mt);mt=setTimeout(()=>m.style.display='none',3500)};
function parse(q){const inc=[],exc=[];(q.match(/-?"[^"]+"|\S+/g)||[]).forEach(t=>{const n=t[0]==='-'&&t.length>1;if(n)t=t.slice(1);t=t.replace(/"/g,'').trim().toLowerCase();if(t)(n?exc:inc).push(t)});return{inc,exc}}

/* ===== permanent storage ===== */
let db=null;
const openDb=()=>new Promise(r=>{try{const o=indexedDB.open('doclibrary',1);o.onupgradeneeded=()=>o.result.createObjectStore('docs',{keyPath:'id'});o.onsuccess=()=>r(o.result);o.onerror=()=>r(null)}catch(e){r(null)}});
const dbRun=(m,fn)=>new Promise(r=>{if(!db)return r(null);try{const t=db.transaction('docs',m),q=fn(t.objectStore('docs'));t.oncomplete=()=>r(q?q.result:true);t.onerror=t.onabort=()=>r(null)}catch(e){r(null)}});
const save=d=>dbRun('readwrite',s=>s.put(d));
async function status(){
  let t=db?'Saved permanently in this app':'⚠ Storage unavailable';
  try{const e=await navigator.storage.estimate();t+=' · '+(e.usage/1048576).toFixed(1)+' MB'}catch(e){}
  $('#status').textContent=docs.length+' file'+(docs.length==1?'':'s')+' · '+t;
}

/* ===== upload ===== */
async function addFiles(files){
  for(const f of files){
    const ext=f.name.split('.').pop().toLowerCase();
    if(!['pdf','xlsx','xls','csv'].includes(ext)){toast('Skipped '+f.name);continue}
    toast('Reading '+f.name+'…');
    try{
      const buf=await f.arrayBuffer(),secs=[];
      if(ext==='pdf'){
        const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;
        for(let p=1;p<=pdf.numPages;p++){const tc=await (await pdf.getPage(p)).getTextContent();secs.push({title:'Page '+p,text:tc.items.map(i=>i.str).join(' ')})}
      }else{
        const wb=XLSX.read(buf,{type:'array'});
        wb.SheetNames.forEach(n=>{const ws=wb.Sheets[n],m=XLSX.utils.sheet_to_html(ws,{editable:false}).match(/<table[\s\S]*<\/table>/),rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
          secs.push({title:n,html:m?m[0]:'',text:rows.map(r=>r.join(' ')).join(' ')})});
      }
      const d={id:Date.now()+'-'+Math.random().toString(36).slice(2,6),name:f.name,type:ext==='pdf'?'pdf':'xls',cat:cat||'General',marks:[],notes:{},sections:secs,blob:new Blob([buf])};
      if(!(await save(d)))toast('Could not save '+f.name+' — storage blocked');
      docs.push(d);toast('Added '+f.name);
    }catch(e){toast('Could not read '+f.name)}
  }
  try{navigator.storage.persist()}catch(e){}
  refresh();status();
}

/* ===== search ===== */
const inScope=d=>(filt==='all'||d.type===filt)&&(!cat||d.cat===cat);
function hits(){
  const w=P.inc;if(!w.length)return null;const out=[];
  docs.forEach((d,i)=>{if(!inScope(d))return;d.sections.forEach((s,j)=>{
    const t=s.text.toLowerCase();
    if(!w.every(x=>t.includes(x))||P.exc.some(x=>t.includes(x)))return;
    let sc=0;w.forEach(x=>sc+=t.split(x).length-1);out.push({i,j,sc})})});
  return out.sort((a,b)=>b.sc-a.sc);
}

/* ===== sidebar ===== */
function renderCats(){
  const cs=[...new Set([...docs.map(d=>d.cat||'General'),...extra])].sort();
  $('#cat').innerHTML='<option value="">All categories</option>'+cs.map(c=>`<option ${c===cat?'selected':''}>${esc(c)}</option>`).join('')+'<option value="__new">+ New category…</option>';
}
function renderMenu(){
  renderCats();
  const H=hits(),m=$('#menu');
  if(!docs.length){m.innerHTML='<p class="muted">No files yet. Upload a PDF or Excel file.</p>';return}
  let h='';
  docs.forEach((d,i)=>{
    if(!inScope(d))return;
    const secs=d.sections.map((s,j)=>({s,j})).filter(o=>!H||H.some(x=>x.i===i&&x.j===o.j));
    if(H&&!secs.length)return;
    h+=`<details class="file" ${(H||(sel&&sel.d===i))?'open':''}><summary>${BD(d)}<span class="n">${esc(d.name)}</span>${H?`<span class="cnt">${secs.length}</span>`:''}<button class="ic" data-edit="${i}" aria-label="Rename or move">✎</button><button class="ic d" data-del="${i}" aria-label="Delete">✕</button></summary>
    <div class="muted" style="padding:0 10px 4px"><span class="tag">${esc(d.cat||'General')}</span></div>`+
    secs.map(o=>`<button class="sec ${sel&&sel.d===i&&sel.s===o.j?'on':''}" data-d="${i}" data-s="${o.j}"><span>${esc(o.s.title)}</span><span>${d.marks.includes(o.j)?'★':''}</span></button>`).join('')+'</details>';
  });
  m.innerHTML=h||'<p class="muted">No file matches.</p>';
}

/* ===== main area ===== */
function refresh(){renderMenu();if(!sel||P.inc.length)showMain()}
function card(i,j,snip){const d=docs[i],s=d.sections[j];return `<div class="card" tabindex="0" data-d="${i}" data-s="${j}"><div class="t">${BD(d)}${esc(d.name)} · ${esc(s.title)}${d.marks.includes(j)?' ★':''}<span class="tag">${esc(d.cat||'General')}</span></div>${snip?`<p>${snip}</p>`:''}</div>`}
function showMain(){
  const H=hits(),v=$('#view');sel=null;
  if(!H){
    const vis=docs.map((d,i)=>({d,i})).filter(o=>inScope(o.d));
    const pages=vis.reduce((a,o)=>a+(o.d.type==='pdf'?o.d.sections.length:0),0),sheets=vis.reduce((a,o)=>a+(o.d.type==='xls'?o.d.sections.length:0),0),bm=[];
    vis.forEach(o=>o.d.marks.forEach(j=>bm.push([o.i,j])));
    const rec=[...vis].sort((a,b)=>b.d.id.localeCompare(a.d.id)).slice(0,6);
    v.innerHTML=`<h2>Dashboard${cat?' · '+esc(cat):''}</h2><div class="tiles"><div class="tile"><b>${vis.length}</b><span>Files</span></div><div class="tile"><b>${pages}</b><span>PDF pages</span></div><div class="tile"><b>${sheets}</b><span>Excel sheets</span></div><div class="tile"><b>${bm.length}</b><span>Bookmarks</span></div></div>`+
    (bm.length?'<h3>★ Bookmarks</h3>'+bm.map(b=>card(b[0],b[1])).join(''):'')+
    (rec.length?'<h3>Recently added</h3>'+rec.map(o=>card(o.i,0)).join(''):'')+
    `<div id="drop"><b>Drag and drop files here</b><p class="muted">PDF, Excel (.xlsx, .xls) and CSV · stored permanently in this app · files go into the selected category</p></div>`;
    return}
  const chips=['all','pdf','xls'].map(c=>`<button class="chip ${filt===c?'on':''}" data-f="${c}">${{all:'All',pdf:'PDF',xls:'Excel'}[c]}</button>`).join('');
  v.innerHTML=`<h2>${H.length} result${H.length==1?'':'s'} for “${esc(term)}”</h2><div class="chips">${chips}</div>`+
  (H.length?H.slice(0,100).map(x=>{const t=docs[x.i].sections[x.j].text,k=t.toLowerCase().indexOf(words()[0]),a=Math.max(0,k-100);return card(x.i,x.j,(a?'… ':'')+hl(t.slice(a,a+260))+' …')}).join(''):'<p class="muted">No matching topic found.</p>');
}

/* ===== viewer: same format as uploaded ===== */
const getPdf=async d=>pdfCache[d.id]||(pdfCache[d.id]=await pdfjsLib.getDocument({data:new Uint8Array(await d.blob.arrayBuffer())}).promise);
function hlDom(root){
  if(!words().length)return;
  const test=new RegExp(words().map(rx).join('|'),'i'),tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];
  while(tw.nextNode())ns.push(tw.currentNode);
  ns.forEach(n=>{if(!test.test(n.nodeValue))return;const sp=document.createElement('span');sp.innerHTML=esc(n.nodeValue).replace(re(),'<mark>$1</mark>');n.replaceWith(...sp.childNodes)});
}
async function open(di,si){
  sel={d:di,s:si};const D=docs[di],S=D.sections[si],my=++token,n=D.sections.length,on=D.marks.includes(si);
  document.body.classList.remove('open');
  $('#view').innerHTML=`<div class="bar"><button id="back">‹ ${P.inc.length?'Results':'Home'}</button><div class="t">${esc(D.name)} — ${esc(S.title)}</div>
  <button id="star" aria-label="Bookmark">${on?'★ Saved':'☆ Bookmark'}</button>
  ${D.type==='pdf'?'<button id="zo">−</button><button id="zi">+</button>':(P.inc.length?`<label class="muted"><input type="checkbox" id="xo" ${xlOnly?'checked':''}> Matching rows only</label>`:'')}
  <button id="pv" ${si?'':'disabled'}>‹</button><span class="muted">${si+1}/${n}</span><button id="nx" ${si<n-1?'':'disabled'}>›</button></div><div id="stage"><p class="muted" style="padding:20px">Loading…</p></div>
  <textarea id="note" placeholder="Your notes for this page…">${esc((D.notes||{})[si]||'')}</textarea>`;
  $('#pv').onclick=()=>open(di,si-1);$('#nx').onclick=()=>open(di,si+1);
  $('#back').onclick=()=>{showMain();renderMenu()};
  $('#star').onclick=()=>{D.marks=on?D.marks.filter(x=>x!==si):[...D.marks,si];save(D);open(di,si)};
  let nt;$('#note').oninput=e=>{clearTimeout(nt);nt=setTimeout(()=>{D.notes=D.notes||{};D.notes[si]=e.target.value;save(D)},400)};
  if($('#zo')){$('#zo').onclick=()=>{z=Math.max(.5,z-.25);open(di,si)};$('#zi').onclick=()=>{z=Math.min(3,z+.25);open(di,si)}}
  renderMenu();
  const st=$('#stage');
  if(D.type==='pdf'){
    try{
      const pdf=await getPdf(D),page=await pdf.getPage(si+1);if(my!==token)return;
      const w=Math.min(st.clientWidth||800,1000)*z,v1=page.getViewport({scale:1}),sc=w/v1.width,vp=page.getViewport({scale:sc*Math.min(devicePixelRatio||1,2)}),vh=page.getViewport({scale:sc});
      const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
      await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;if(my!==token)return;
      const wrap=document.createElement('div');wrap.className='pdfw';wrap.style.width=w+'px';wrap.appendChild(cv);
      if(words().length){const tc=await page.getTextContent();
        tc.items.forEach(it=>{if(!words().some(x=>it.str.toLowerCase().includes(x)))return;
          const t=pdfjsLib.Util.transform(vh.transform,it.transform),h=Math.hypot(t[2],t[3]),b=document.createElement('i');
          b.style.cssText=`left:${t[4]}px;top:${t[5]-h}px;width:${it.width*sc}px;height:${h*1.15}px`;wrap.appendChild(b)})}
      st.innerHTML='';st.appendChild(wrap);
    }catch(e){st.innerHTML='<p class="muted" style="padding:20px">Could not display this page.</p>'}
  }else{
    st.innerHTML=`<div class="xl">${S.html||'<p class="muted">Empty sheet</p>'}</div>`;
    const xl=st.firstChild;
    if(P.inc.length&&xlOnly)xl.querySelectorAll('tr').forEach((r,k)=>{if(k&&!words().some(x=>r.textContent.toLowerCase().includes(x)))r.remove()});
    hlDom(xl);
    const xo=$('#xo');if(xo)xo.onchange=()=>{xlOnly=xo.checked;open(di,si)};
  }
}

/* ===== backup / restore ===== */
async function exportAll(){
  toast('Preparing backup…');const out=[];
  for(const d of docs)out.push({...d,blob:await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(d.blob)})});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));a.download='library-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
async function importAll(f){
  try{const arr=JSON.parse(await f.text());
    for(const d of arr){const bin=atob(d.blob),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);d.blob=new Blob([u]);await save(d);docs=docs.filter(x=>x.id!==d.id);docs.push(d)}
    toast('Restored '+arr.length+' file(s)');refresh();status()}catch(e){toast('That is not a valid backup file')}
}

/* ===== events ===== */
$('#q').oninput=e=>{document.body.classList.remove('open');term=e.target.value.trim();P=parse(term);renderMenu();showMain()};
$('#cat').onchange=e=>{let v=e.target.value;if(v==='__new'){v=(prompt('New category name')||'').trim();if(v)extra.push(v)}cat=v;renderMenu();showMain()};
$('#menu').onclick=async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.del!==undefined){e.preventDefault();const i=+b.dataset.del,d=docs[i];
    if(confirm('Delete "'+d.name+'" permanently?')){await dbRun('readwrite',s=>s.delete(d.id));delete pdfCache[d.id];docs.splice(i,1);renderMenu();showMain();status()}return}
  if(b.dataset.edit!==undefined){e.preventDefault();const d=docs[+b.dataset.edit],n=prompt('File name',d.name);if(n&&n.trim())d.name=n.trim();const c=prompt('Category',d.cat||'General');if(c&&c.trim())d.cat=c.trim();save(d);renderMenu();return}
  if(b.dataset.d!==undefined)open(+b.dataset.d,+b.dataset.s);
};
$('#view').onclick=e=>{
  const c=e.target.closest('.card');if(c)return open(+c.dataset.d,+c.dataset.s);
  const f=e.target.closest('.chip');if(f){filt=f.dataset.f;renderMenu();showMain()}
};
$('#view').onkeydown=e=>{if(e.key==='Enter'){const c=e.target.closest('.card');if(c)c.click()}};
document.onkeydown=e=>{
  const t=e.target.tagName;
  if(t==='TEXTAREA'||t==='SELECT')return;
  if(t==='INPUT'){if(e.key==='Escape')e.target.blur();return}
  if(e.key==='/'){e.preventDefault();$('#q').focus()}
  else if(sel&&e.key==='ArrowLeft'&&!$('#pv').disabled)$('#pv').click();
  else if(sel&&e.key==='ArrowRight'&&!$('#nx').disabled)$('#nx').click();
  else if(sel&&e.key==='Escape')$('#back').click();
};
$('#menubtn').onclick=()=>document.body.classList.toggle('open');
$('#f').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
$('#exp').onclick=exportAll;
$('#imp').onchange=e=>{if(e.target.files[0])importAll(e.target.files[0]);e.target.value=''};
$('#theme').onclick=()=>{const dk=(document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark',n=dk?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('libtheme',n)}catch(e){}};
try{const t=localStorage.getItem('libtheme');if(t)document.documentElement.dataset.theme=t;else if(matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.dataset.theme='dark'}catch(e){}
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();addFiles([...e.dataTransfer.files])});

/* ===== mobile + install ===== */
$('#nHome').onclick=()=>{document.body.classList.remove('open');$('#q').value='';term='';P={inc:[],exc:[]};renderMenu();showMain()};
$('#nSearch').onclick=()=>{document.body.classList.remove('open');$('#q').focus()};
$('#nLib').onclick=()=>document.body.classList.toggle('open');
$('#nUp').onclick=()=>$('#f').click();
let tx0=null;
$('#view').addEventListener('touchstart',e=>{tx0=e.target.closest('.pdfw')&&z<=1?e.touches[0].clientX:null},{passive:true});
$('#view').addEventListener('touchend',e=>{if(tx0===null)return;const dx=e.changedTouches[0].clientX-tx0;tx0=null;if(Math.abs(dx)>80){const b=$(dx<0?'#nx':'#pv');if(b&&!b.disabled)b.click()}},{passive:true});
let dip;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('#install').hidden=false});
$('#install').onclick=()=>{if(dip){dip.prompt();dip=null;$('#install').hidden=true}};
addEventListener('appinstalled',()=>{$('#install').hidden=true});
try{if(/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone&&!localStorage.getItem('iosHint')){localStorage.setItem('iosHint','1');setTimeout(()=>toast('To install: tap Share, then Add to Home Screen'),2500)}}catch(e){}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});

(async()=>{db=await openDb();docs=((await dbRun('readonly',s=>s.getAll()))||[]).map(d=>({marks:[],notes:{},cat:'General',...d}));try{navigator.storage.persist()}catch(e){}renderMenu();showMain();status()})();
</script>
</body>
</html>
